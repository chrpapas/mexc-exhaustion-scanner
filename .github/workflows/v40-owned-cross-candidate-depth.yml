name: V40 owned one-three CROSS account candidate sized-depth source

on:
  push:
    branches:
      - "feat/v40-owned-cross-depth-witness-*"
  pull_request:
    paths:
      - "app/t100_v40_owned_cross_candidate_witness.py"
      - "app/t100_live_v40_candidate_market_witness.py"
      - "app/t100_live_v40_entry_coordinator.py"
      - "tests/test_t100_v40_owned_cross_candidate_witness.py"
      - ".github/workflows/v40-owned-cross-candidate-depth.yml"

permissions:
  contents: read

jobs:
  owned-cross-margin-not-faked:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Actual immutable-owned 1-3 slot depth and external-signed data; no POST
        run: |
          python -m compileall -q app/t100_v40_owned_cross_candidate_witness.py app/t100_live_v40_entry_coordinator.py
          python -m pytest -q \
            tests/test_t100_v40_owned_cross_candidate_witness.py \
            tests/test_t100_live_v40_candidate_market_witness.py \
            tests/test_t100_live_v40_entry_coordinator.py \
            tests/test_t100_v40_concrete_portfolio_factory.py \
            tests/test_t100_v40_nonflat_exit_frame_reader.py \
            tests/test_t100_v40_portfolio_order_transport.py
