name: V40 multi-slot native-market-stop guardian offline

on:
  push:
    branches:
      - "feature/v40-four-slot-protection-audit-*"
  pull_request:
    paths:
      - "app/t100_v40_four_slot_guardian_policy.py"
      - "tests/test_t100_v40_four_slot_guardian_policy.py"
      - ".github/workflows/v40-four-slot-stop-audit.yml"

permissions:
  contents: read

jobs:
  every-owned-cross-short-has-native-full-volume-market-sl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline requirements
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q app/t100_v40_four_slot_guardian_policy.py
      - name: Four-slot exact provenance and hard rejection tests
        run: |
          python -m pytest -q \
            tests/test_t100_v40_four_slot_guardian_policy.py \
            tests/test_t100_v40_guardian_owned_cross.py
      - name: Must not be promoted into Render without a separate release
        run: |
          ! grep -R "t100_v40_four_slot_guardian_policy" \
            app/t100_v40_render_real_canary_worker.py \
            app/t100_v40_canary_durable_guardian.py
