name: V40 immutable closed-position finance SQL on disposable PostgreSQL

on:
  push:
    branches:
      - "feat/v40-close-only-financial-artifact-persistence-*"
  pull_request:
    paths:
      - "app/t100_v40_close_financial_artifact_staging.py"
      - "tests/test_t100_v40_close_artifact_postgres_ephemeral.py"
      - ".github/workflows/v40-close-artifact-postgresql16-e2e.yml"

permissions:
  contents: read

jobs:
  real-postgres-exact-rows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mexc_exhaustion
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: t100-ci-only-local-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mexc_exhaustion"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 12
    env:
      CI: 'true'
      T100_V40_CLOSE_ARTIFACT_PG16_CI_ONLY: 'yes'
      T100_EXECUTION_MODE: paper
      T100_LIVE_ORDER_API_ENABLED: 'false'
      T100_LIVE_KILL_SWITCH: 'true'
      EXECUTION_ENABLED: 'false'
      TRADING_MODE: paper
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: mexc_exhaustion
      PGUSER: postgres
      PGPASSWORD: t100-ci-only-local-postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Exercise immutable release-independent finance custody on real PG
        run: |
          python -m pytest -q tests/test_t100_v40_close_artifact_postgres_ephemeral.py
