name: V40 primary schema-owner rights audit (read only)

on:
  push:
    branches:
      - "feat/v40-prod-owner-role-audit-*"
  pull_request:
    paths:
      - "app/t100_v40_schema_owner_role_probe.py"
      - "app/t100_v40_render_four_slot_readonly_worker.py"
      - "tests/test_t100_v40_schema_owner_role_probe.py"
      - "tests/test_t100_v40_schema_owner_role_postgres_ephemeral.py"
      - ".github/workflows/v40-owner-role-catalog-readonly.yml"

permissions:
  contents: read

jobs:
  readonly-catalog-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mexc_exhaustion
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: t100-ci-only-local-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mexc_exhaustion"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 12
    env:
      CI: 'true'
      T100_V40_OWNER_AUDIT_CI_ONLY: 'yes'
      T100_EXECUTION_MODE: paper
      T100_LIVE_ORDER_API_ENABLED: 'false'
      T100_LIVE_KILL_SWITCH: 'true'
      EXECUTION_ENABLED: 'false'
      TRADING_MODE: paper
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: mexc_exhaustion
      PGUSER: postgres
      PGPASSWORD: t100-ci-only-local-postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Verify restricted owner-catalog probe and real PostgreSQL role grants
        run: |
          python -m compileall -q app/t100_v40_schema_owner_role_probe.py app/t100_v40_render_four_slot_readonly_worker.py
          python -m pytest -q tests/test_t100_v40_schema_owner_role_probe.py tests/test_t100_v40_schema_owner_role_postgres_ephemeral.py tests/test_t100_v40_render_four_slot_readonly_worker.py
