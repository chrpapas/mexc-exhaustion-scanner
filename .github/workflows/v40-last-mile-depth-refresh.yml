name: V40 last-mile order-book freshness safety

on:
  pull_request:
    paths:
      - "app/t100_live_v40_candidate_market_witness.py"
      - "tests/test_t100_live_v40_candidate_market_witness.py"
      - ".github/workflows/v40-last-mile-depth-refresh.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-bookend-and-depth:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Compile and offline regression (no real API, SQL mutations or order POST)
        run: |
          python -m compileall -q app/t100_live_v40_candidate_market_witness.py
          python -m pytest -q \
            tests/test_t100_live_v40_candidate_market_witness.py \
            tests/test_t100_v40_first_canary_risk_witness.py \
            tests/test_t100_v40_first_signal_execution.py \
            tests/test_t100_v40_skyai_risk_preflight_diagnostics.py
