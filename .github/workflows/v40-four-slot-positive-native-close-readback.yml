name: V40 four-slot positive native-close readback (offline)

on:
  push:
    branches:
      - "feat/v40-portfolio-positive-close-readback-*"
  pull_request:
    paths:
      - "app/t100_v40_portfolio_positive_native_close_reader.py"
      - "tests/test_t100_v40_portfolio_positive_native_close_reader.py"
      - ".github/workflows/v40-four-slot-positive-native-close-readback.yml"

permissions:
  contents: read

jobs:
  positive-not-candle-close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Syntax and exact positive native-close integration
        run: |
          python -m compileall -q app/t100_v40_portfolio_positive_native_close_reader.py
          python -m pytest -q \
            tests/test_t100_v40_portfolio_positive_native_close_reader.py \
            tests/test_t100_v40_unreleased_portfolio_native_close.py \
            tests/test_t100_v40_native_close_release_handoff.py \
            tests/test_t100_v40_unreleased_verified_slot_release.py \
            tests/test_t100_v40_live_portfolio_supervisor.py
