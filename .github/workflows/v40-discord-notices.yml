name: V40 Discord genuine signal and verified-trade notices (offline)

on:
  pull_request:
    paths:
      - "app/t100_v40_discord_events.py"
      - "app/t100_v40_render_stage2_scanner.py"
      - "app/t100_v40_render_real_canary_worker.py"
      - "app/t100_v40_emergency_runner.py"
      - "tests/test_t100_v40_discord_events.py"
      - ".github/workflows/v40-discord-notices.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notices:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: No external Discord, account or exchange calls
        run: |
          python -m compileall -q app/t100_v40_discord_events.py app/t100_v40_render_stage2_scanner.py app/t100_v40_render_real_canary_worker.py app/t100_v40_emergency_runner.py
          python -m pytest -q tests/test_t100_v40_discord_events.py tests/test_t100_v40_render_stage2_scanner.py tests/test_t100_v40_render_real_canary_worker.py tests/test_t100_v40_emergency_runner.py
