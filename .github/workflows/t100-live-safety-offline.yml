name: T100 live safety offline checks

on:
  pull_request:
    paths:
      - 'app/t100_live_*.py'
      - 'app/t100_v40_admission.py'
      - 'tests/test_t100_live_*.py'
      - 'tests/test_t100_v40_admission.py'
      - '.github/workflows/t100-live-safety-offline.yml'
  push:
    branches:
      - feature/t100-live-readiness-gates-20261023

permissions:
  contents: read

jobs:
  pure-python-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .
      T100_EXECUTION_MODE: paper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile pure policy and lifecycle modules
        run: |
          python -m py_compile app/t100_live_authorization.py app/t100_live_execution.py app/t100_live_cross_margin_stress.py app/t100_live_position_mode_shape.py app/t100_live_mixed_margin_observation.py app/t100_live_cross_risk_observation.py app/t100_live_cross_risk_collector.py app/t100_live_cross_risk_inventory_shape.py app/t100_live_cross_risk_diagnostic.py app/t100_live_private_positions_access.py app/t100_live_private_positions_access_cli.py app/t100_live_risk_tier_witness.py app/t100_live_risk_schedule_shape.py app/t100_live_risk_schedule_probe.py app/t100_live_risk_schedule_probe_cli.py app/t100_live_incremental_tier_candidate.py app/t100_live_incremental_tier_probe.py app/t100_live_incremental_tier_probe_cli.py app/t100_live_candidate_tier_observer.py app/t100_live_candidate_tier_observer_cli.py app/t100_live_margin_mode_witness.py app/t100_live_margin_mode_witness_cli.py app/t100_live_candidate_position_conflict.py app/t100_live_candidate_position_conflict_cli.py app/t100_live_candidate_stop_scope.py app/t100_live_candidate_stop_scope_cli.py app/t100_live_candidate_limit_scope.py app/t100_live_candidate_limit_scope_cli.py app/t100_live_v40_cross_stop_envelope.py app/t100_live_cross_entry_research.py app/t100_live_v40_prestop_path.py app/t100_live_public_v40_tier_stress.py app/t100_live_public_v40_tier_stress_cli.py app/t100_live_public_v40_capacity.py app/t100_live_public_v40_capacity_cli.py app/t100_live_v40_capacity_parity.py app/t100_live_v40_historical_capacity.py scripts/v40_historical_capacity_audit.py scripts/v40_local_contract_source_inventory.py app/t100_live_api_eligibility_census.py app/t100_live_api_eligibility_census_cli.py app/t100_live_pnl_pair_recheck.py app/t100_live_pnl_sync_observation.py app/t100_live_pnl_sync_cli.py app/t100_live_four_slot_planner.py app/t100_live_four_slot_snapshot_coordinator.py app/t100_live_four_slot_ledger_reader.py app/t100_live_four_slot_reservations.py app/t100_live_four_slot_attempt_journal.py app/t100_live_