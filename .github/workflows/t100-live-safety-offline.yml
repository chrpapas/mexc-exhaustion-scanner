name: T100 live safety offline checks

on:
  pull_request:
    paths:
      - 'app/t100_live_*.py'
      - 'app/t100_v40_admission.py'
      - 'tests/test_t100_live_*.py'
      - 'tests/test_t100_v40_admission.py'
      - '.github/workflows/t100-live-safety-offline.yml'
  push:
    branches:
      - feature/t100-live-readiness-gates-20261023

permissions:
  contents: read

jobs:
  pure-python-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .
      T100_EXECUTION_MODE: paper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile pure policy and lifecycle modules
        run: |
          python -m py_compile app/t100_live_authorization.py app/t100_live_code_revision_gate.py app/t100_live_active_tpsl.py app/t100_live_stop_transition.py app/t100_live_close_provenance.py app/t100_live_funding_probe.py app/t100_live_funding_ledger.py app/t100_live_fill_probe.py app/t100_live_fill_ledger.py app/t100_live_durable_recovery.py app/t100_live_checkpoint_journal.py app/t100_live_checkpoint_coordinator.py app/t100_live_kill.py app/t100_live_soak.py app/t100_live_soak_cli.py app/t100_live_operational_risk.py app/t100_live_clock_skew.py app/t100_live_leader_fencing.py app/t100_live_mutation_permit.py app/t100_live_symbol_crosscheck.py app/t100_live_symbol_eligibility.py app/t100_live_position_margin_witness.py app/t100_live_inventory_completeness.py app/t100_live_inventory_completeness_probe.py app/t100_live_account_reconciliation.py app/t100_live_schema_gate.py app/t100_live_db_inspect.py app/t100_live_db_migration.py app/t100_live_role_preflight.py app/t100_live_role_setup.py app/t100_live_db_fencing_diagnostic.py app/t100_live_db_state_gate.py app/t100_live_readiness_bundle.py app/t100_live_strategy_parity_gate.py app/t100_live_ops_notifier.py app/t100_live_shadow_runtime.py app/t100_live_ws_semantics.py app/t100_live_ws_readiness_gate.py app/t100_live_ws_rest_correlation.py app/t100_live_private_ws.py app/t100_live_ws_probe.py app/t100_live_continuity_probe.py app/t100_live_continuity_soak.py app/t100_live_schema_assessment.py app/t100_live_contract_evidence.py app/t100_live_preflight.py app/t100_live_shadow_replay.py app/t100_live_consistency.py app/t100_live_readonly_probe.py app/t100_live_pagination.py app/t100_live_shadow_session.py app/t100_live_shadow.py app/t100_live_snapshot.py app/t100_live_accounting.py app/t100_live_position_accounting.py app/t100_live_lifecycle_audit.py app/t100_live_stop_journal.py app/t100_live_expected_stop_transition.py app/t100_live_stop_amendment_coordinator.py app/t100_live_stop_mutation_executor.py app/t100_live_stop_update_pipeline.py app/t100_live_recovery.py app/t100_live_supervisor.py app/t100_live_trailing.py app/t100_v40_admission.py
      - name: Run offline lifecycle and V40 tests without credentials
        run: |
          python -m unittest -v tests.test_t100_live_authorization tests.test_t100_live_code_revision_gate tests.test_t100_live_active_tpsl tests.test_t100_live_stop_transition tests.test_t100_live_close_provenance tests.test_t100_live_funding_probe tests.test_t100_live_funding_ledger tests.test_t100_live_fill_probe tests.test_t100_live_fill_ledger tests.test_t100_live_durable_recovery tests.test_t100_live_durable_migration tests.test_t100_live_runtime_privileges tests.test_t100_live_checkpoint_journal tests.test_t100_live_checkpoint_coordinator tests.test_t100_live_kill tests.test_t100_live_soak tests.test_t100_live_soak_cli tests.test_t100_live_operational_risk tests.test_t100_live_clock_skew tests.test_t100_live_leader_fencing tests.test_t100_live_mutation_permit tests.test_t100_live_symbol_crosscheck tests.test_t100_live_symbol_eligibility tests.test_t100_live_position_margin_witness tests.test_t100_live_inventory_completeness tests.test_t100_live_inventory_completeness_probe tests.test_t100_live_account_reconciliation tests.test_t100_live_schema_gate tests.test_t100_live_db_inspect tests.test_t100_live_db_migration tests.test_t100_live_role_preflight tests.test_t100_live_role_setup tests.test_t100_live_db_fencing_diagnostic tests.test_t100_live_db_state_gate tests.test_t100_live_readiness_bundle tests.test_t100_live_strategy_parity_gate tests.test_t100_live_ops_notifier tests.test_t100_live_shadow_runtime tests.test_t100_live_shadow_blueprint tests.test_t100_live_ws_semantics tests.test_t100_live_ws_readiness_gate tests.test_t100_live_ws_rest_correlation tests.test_t100_live_private_ws tests.test_t100_live_ws_probe tests.test_t100_live_continuity_probe tests.test_t100_live_continuity_soak tests.test_t100_live_schema_assessment tests.test_t100_live_contract_evidence tests.test_t100_live_preflight tests.test_t100_live_shadow_replay tests.test_t100_live_consistency tests.test_t100_live_readonly_probe tests.test_t100_live_pagination tests.test_t100_live_shadow_sess