name: V40 positive native-close to slot release handoff (offline)

on:
  push:
    branches:
      - "feat/v40-native-close-verified-release-handoff-*"
  pull_request:
    paths:
      - "app/t100_v40_native_close_release_handoff.py"
      - "tests/test_t100_v40_native_close_release_handoff.py"
      - ".github/workflows/v40-native-close-release-handoff.yml"

permissions:
  contents: read

jobs:
  native-close-atomic-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q app/t100_v40_native_close_release_handoff.py
      - name: Run proven native close and durable slot release tests
        run: |
          python -m pytest -q \
            tests/test_t100_v40_native_close_release_handoff.py \
            tests/test_t100_v40_unreleased_verified_slot_release.py \
            tests/test_t100_v40_unreleased_portfolio_native_close.py \
            tests/test_t100_v40_live_portfolio_supervisor.py
