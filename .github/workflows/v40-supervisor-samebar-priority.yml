name: V40 supervisor same-bar candidate priority fail-closed

on:
  pull_request:
    paths:
      - "app/t100_v40_live_portfolio_supervisor.py"
      - "tests/test_t100_v40_live_portfolio_supervisor.py"
      - ".github/workflows/v40-supervisor-samebar-priority.yml"

permissions:
  contents: read

jobs:
  priority-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_t100_v40_live_portfolio_supervisor.py
