name: V40 frozen Min30 unchanged stop atomic cursor commit

on:
  push:
    branches:
      - "feat/v40-durable-unchanged-bar-cursor-*"
  pull_request:
    paths:
      - "app/t100_live_checkpoint_journal.py"
      - "app/t100_live_durable_recovery.py"
      - "app/t100_v40_unreleased_bar_cursor.py"
      - "app/t100_v40_unchanged_bar_commit_port.py"
      - "tests/test_t100_v40_armed_unchanged_bar_revision.py"
      - "tests/test_t100_v40_atomic_unchanged_bar_commit_port.py"
      - ".github/workflows/v40-frozen-unchanged-bar-atomic-commit.yml"

permissions:
  contents: read

jobs:
  min30-immutable-atomic-bars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install -e ".[dev]"
      - name: Frozen bar, immutable restart, and atomic cursor
        run: |
          python -m compileall -q \
            app/t100_live_checkpoint_journal.py \
            app/t100_live_durable_recovery.py \
            app/t100_v40_unreleased_bar_cursor.py \
            app/t100_v40_unchanged_bar_commit_port.py
          python -m pytest -q \
            tests/test_t100_v40_armed_unchanged_bar_revision.py \
            tests/test_t100_v40_immutable_bar_checkpoint.py \
            tests/test_t100_v40_unreleased_bar_cursor.py \
            tests/test_t100_live_checkpoint_journal.py \
            tests/test_t100_live_durable_recovery.py \
            tests/test_t100_v40_unreleased_verified_exit_handoff.py \
            tests/test_t100_v40_atomic_unchanged_bar_commit_port.py \
            tests/test_t100_v40_live_portfolio_supervisor.py
