name: V40 supervisor executes one fenced native-close settlement (no OPEN)

on:
  push:
    branches:
      - "feat/v40-supervisor-fenced-native-settlement-*"
  pull_request:
    paths:
      - "app/t100_v40_live_portfolio_supervisor.py"
      - "app/t100_v40_full_portfolio_runtime.py"
      - "tests/test_t100_v40_supervisor_native_exit_settlement.py"
      - ".github/workflows/v40-forward-fenced-supervisor-native-close.yml"

permissions:
  contents: read

jobs:
  final-native-close-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Execute exact signed closed position -> fenced CAS and no entry
        run: |
          python -m compileall -q app/t100_v40_live_portfolio_supervisor.py app/t100_v40_full_portfolio_runtime.py
          python -m pytest -q \
            tests/test_t100_v40_supervisor_native_exit_settlement.py \
            tests/test_t100_v40_forward_close_finalizer.py \
            tests/test_t100_v40_forward_close_port_binding.py \
            tests/test_t100_v40_full_portfolio_runtime.py \
            tests/test_t100_v40_close_financial_artifact_staging.py \
            tests/test_t100_v40_native_close_mismatch_recovery.py \
            tests/test_t100_v40_live_portfolio_supervisor.py
