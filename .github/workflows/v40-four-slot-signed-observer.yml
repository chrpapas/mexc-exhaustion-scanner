name: V40 four-slot signed GET and restricted-ledger observer (unreleased)

on:
  push:
    branches:
      - "feature/v40-four-slot-live-get-observer-*"
  pull_request:
    paths:
      - "app/t100_v40_four_slot_signed_observer.py"
      - "tests/test_t100_v40_four_slot_signed_observer.py"
      - ".github/workflows/v40-four-slot-signed-observer.yml"

permissions:
  contents: read

jobs:
  complete-signed-account-recovery-no-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q app/t100_v40_four_slot_signed_observer.py
      - name: Verify all four slots read-only
        run: |
          python -m pytest -q \
            tests/test_t100_v40_four_slot_signed_observer.py \
            tests/test_t100_v40_four_slot_guardian_policy.py \
            tests/test_t100_live_four_slot_snapshot_coordinator.py
      - name: New observer must not be on live trade path yet
        run: |
          ! grep -R "t100_v40_four_slot_signed_observer" \
            app/t100_v40_render_real_canary_worker.py \
            app/t100_v40_canary_durable_guardian.py \
            app/t100_v40_render_executor_disabled_worker.py
