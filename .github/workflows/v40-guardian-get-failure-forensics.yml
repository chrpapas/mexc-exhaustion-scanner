name: V40 guardian GET failure forensics (offline)

on:
  push:
    branches:
      - "fix/v40-guardian-signed-get-failure-diagnostics-*"
  pull_request:
    paths:
      - "app/t100_v40_guardian_get_failure_codes.py"
      - "app/t100_live_guardian_readonly_once.py"
      - "app/t100_live_readonly_probe.py"
      - "app/t100_v40_guardian_account_and_owned.py"
      - "app/t100_v40_canary_durable_guardian.py"
      - "tests/test_t100_v40_guardian_get_failure_codes.py"
      - ".github/workflows/v40-guardian-get-failure-forensics.yml"

permissions:
  contents: read

jobs:
  redacted-failure-and-sticky-latch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q app/t100_v40_guardian_get_failure_codes.py
      - name: Verify errors, compatibility and no trade permits
        run: |
          python -m pytest -q \
            tests/test_t100_v40_guardian_get_failure_codes.py \
            tests/test_t100_live_guardian_readonly_once.py \
            tests/test_t100_live_readonly_probe.py \
            tests/test_t100_v40_canary_durable_guardian.py \
            tests/test_t100_v40_guardian_recovery_003.py \
            tests/test_t100_v40_guardian_post_gate.py
