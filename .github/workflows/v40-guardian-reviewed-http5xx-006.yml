name: V40 guardian incident-preserving 006 HTTP5xx recovery

on:
  push:
    branches:
      - "fix/v40-guardian-006-reviewed-http5xx-recovery-*"
  pull_request:
    paths:
      - "app/t100_v40_guardian_recovery_006.py"
      - "app/t100_v40_canary_durable_guardian.py"
      - "app/t100_v40_guardian_post_gate.py"
      - "app/t100_v40_unreleased_nonflat_guardian_evidence.py"
      - "tests/test_t100_v40_guardian_recovery_006.py"
      - ".github/workflows/v40-guardian-reviewed-http5xx-006.yml"

permissions:
  contents: read

jobs:
  preserve-old-sticky-latches:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Require exact sole 005 incident, immutable prior scopes, delivered Discord and two signed GETs
        run: |
          python -m compileall -q app/t100_v40_guardian_recovery_006.py app/t100_v40_canary_durable_guardian.py
          python -m pytest -q \
            tests/test_t100_v40_guardian_recovery_006.py \
            tests/test_t100_v40_guardian_recovery_005.py \
            tests/test_t100_v40_canary_durable_guardian.py \
            tests/test_t100_v40_guardian_post_gate.py \
            tests/test_t100_v40_unreleased_nonflat_guardian_evidence.py
