name: V40 guardian recovery checks

on:
  pull_request:
    paths:
      - "app/t100_v40_guardian_*.py"
      - "app/t100_v40_canary_durable_guardian.py"
      - "tests/test_t100_v40_guardian_*.py"
      - "tests/test_t100_v40_canary_durable_guardian.py"
      - ".github/workflows/v40-guardian-recovery-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardian-offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install repository and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run fail-closed guardian and release-gate checks (no credentials)
        run: >-
          python -m pytest -q
          tests/test_t100_v40_guardian_recovery_002.py
          tests/test_t100_v40_guardian_reviewed_generation.py
          tests/test_t100_v40_guardian_post_gate.py
          tests/test_t100_v40_canary_durable_guardian.py
