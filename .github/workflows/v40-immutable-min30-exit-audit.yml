name: V40 immutable historical Min30 exit audit

on:
  pull_request:
    paths:
      - "scripts/v40_exit_trigger_audit.py"
      - "tests/test_t100_live_v40_exit_trigger_audit.py"
      - ".github/workflows/v40-immutable-min30-exit-audit.yml"

permissions:
  contents: read

jobs:
  immutable-min30-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q scripts/v40_exit_trigger_audit.py
      - run: python -m pytest -q tests/test_t100_live_v40_exit_trigger_audit.py
