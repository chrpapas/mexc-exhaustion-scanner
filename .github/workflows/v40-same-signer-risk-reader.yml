name: V40 same-account signed 4-slot risk collection (GET only)

on:
  push:
    branches:
      - "feature/v40-same-signer-four-slot-risk-reader-*"
  pull_request:
    paths:
      - "app/t100_v40_unreleased_same_signer_risk_reader.py"
      - "tests/test_t100_v40_unreleased_same_signer_risk_reader.py"
      - ".github/workflows/v40-same-signer-risk-reader.yml"

permissions:
  contents: read

jobs:
  exact-signer-risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q app/t100_v40_unreleased_same_signer_risk_reader.py
      - run: |
          python -m pytest -q \
            tests/test_t100_v40_unreleased_same_signer_risk_reader.py \
            tests/test_t100_v40_unreleased_current_portfolio_risk.py \
            tests/test_t100_live_cross_risk_collector.py \
            tests/test_t100_live_cross_risk_observation.py \
            tests/test_t100_live_four_slot_mexc_readonly.py \
            tests/test_t100_live_four_slot_ledger_reader.py
