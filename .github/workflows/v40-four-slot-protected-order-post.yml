name: V40 four-slot protected genuine-signal SHORT submission (offline)

on:
  push:
    branches:
      - "feat/v40-four-slot-protected-order-post-*"
  pull_request:
    paths:
      - "app/t100_v40_portfolio_order_transport.py"
      - "tests/test_t100_v40_portfolio_order_transport.py"
      - ".github/workflows/v40-four-slot-protected-order-post.yml"

permissions:
  contents: read

jobs:
  exact-order-one-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Syntax compile
        run: python -m compileall -q app/t100_v40_portfolio_order_transport.py
      - name: Prove 0-3 owned submissions, guardian, margin, full ledger and no retries
        run: |
          python -m pytest -q \
            tests/test_t100_v40_portfolio_order_transport.py \
            tests/test_t100_live_v40_dispatch_executor.py \
            tests/test_t100_v40_four_slot_release_policy.py \
            tests/test_t100_v40_exchange_leverage_plan.py \
            tests/test_t100_v40_native_stop_amend_transport.py \
            tests/test_t100_v40_live_portfolio_supervisor.py \
            tests/test_t100_live_four_slot_snapshot_coordinator.py
