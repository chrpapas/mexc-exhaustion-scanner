name: V40 guardian transient open-position GET safety (offline)

on:
  pull_request:
    paths:
      - "app/t100_live_guardian_readonly_once.py"
      - "app/t100_v40_guardian_account_and_owned.py"
      - "tests/test_t100_v40_guardian_transient_positions_retry.py"
      - ".github/workflows/v40-guardian-transient-positions-get.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-unsafe-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Regression tests no real network, order, latch mutation
        run: |
          python -m compileall -q app/t100_live_guardian_readonly_once.py app/t100_v40_guardian_account_and_owned.py
          python -m pytest -q \
            tests/test_t100_v40_guardian_transient_positions_retry.py \
            tests/test_t100_v40_guardian_inventory_diagnostics.py \
            tests/test_t100_v40_guardian_get_failure_codes.py \
            tests/test_t100_v40_guardian_bounded_get_retry.py \
            tests/test_t100_v40_canary_durable_guardian.py
