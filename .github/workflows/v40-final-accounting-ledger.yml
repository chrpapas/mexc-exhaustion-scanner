name: V40 immutable final-accounting settlement gate (offline)

on:
  push:
    branches:
      - "feat/v40-immutable-final-accounting-*"
  pull_request:
    paths:
      - "app/t100_live_position_accounting.py"
      - "tests/test_t100_v40_final_accounting_ledger.py"
      - ".github/workflows/v40-final-accounting-ledger.yml"

permissions:
  contents: read

jobs:
  immutable-close-settlement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Compile and test PnL, full immutable settlement and native-close readback
        run: |
          python -m compileall -q app/t100_live_position_accounting.py tests/test_t100_v40_final_accounting_ledger.py
          python -m pytest -q \
            tests/test_t100_v40_final_accounting_ledger.py \
            tests/test_t100_live_position_accounting.py \
            tests/test_t100_v40_portfolio_close_financial_reader.py \
            tests/test_t100_v40_native_close_release_handoff.py \
            tests/test_t100_v40_unreleased_verified_slot_release.py
