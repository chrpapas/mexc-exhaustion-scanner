name: V40 immutable owned CROSS leverage quote handoff

on:
  push:
    branches:
      - "feat/v40-exact-cross-leverage-handoff-*"
  pull_request:
    paths:
      - "app/t100_v40_owned_cross_candidate_witness.py"
      - "app/t100_live_v40_entry_coordinator.py"
      - "app/t100_live_v40_candidate_market_witness.py"
      - "tests/test_t100_v40_owned_cross_candidate_witness.py"
      - "tests/test_t100_v40_full_portfolio_risk_context_handoff.py"
      - ".github/workflows/v40-owned-exact-cross-leverage-handoff.yml"

permissions:
  contents: read

jobs:
  exact-no-resize-and-no-post:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Signal-bound assessed CROSS lot margin, signed bookend, no exchange posts
        run: |
          python -m compileall -q app/t100_v40_owned_cross_candidate_witness.py app/t100_live_v40_entry_coordinator.py
          python -m pytest -q \
            tests/test_t100_v40_owned_cross_candidate_witness.py \
            tests/test_t100_v40_full_portfolio_risk_context_handoff.py \
            tests/test_t100_live_v40_entry_coordinator.py \
            tests/test_t100_live_v40_candidate_market_witness.py \
            tests/test_t100_v40_exchange_leverage_plan.py \
            tests/test_t100_v40_portfolio_order_transport.py \
            tests/test_t100_v40_concrete_portfolio_factory.py \
            tests/test_t100_v40_portfolio_native_stop_transport.py
