name: V40 real current native SL trailing preflight from causal Min30

on:
  push:
    branches:
      - "feat/v40-real-native-stop-preflight-*"
  pull_request:
    paths:
      - "app/t100_v40_real_current_stop_preflight.py"
      - "app/t100_v40_concrete_portfolio_factory.py"
      - "app/t100_v40_portfolio_native_stop_transport.py"
      - "tests/test_t100_v40_real_current_stop_preflight.py"
      - "tests/test_t100_v40_concrete_portfolio_factory.py"
      - "tests/test_t100_v40_portfolio_native_stop_transport.py"
      - ".github/workflows/v40-real-min30-native-stop-preflight.yml"

permissions:
  contents: read

jobs:
  signed-get-exact-trailing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Causal Min30 and signed account-bookended native stop (no real POST)
        run: |
          python -m compileall -q app/t100_v40_real_current_stop_preflight.py app/t100_v40_concrete_portfolio_factory.py
          python -m pytest -q \
            tests/test_t100_v40_real_current_stop_preflight.py \
            tests/test_t100_v40_concrete_portfolio_factory.py \
            tests/test_t100_v40_portfolio_native_stop_transport.py \
            tests/test_t100_v40_portfolio_stop_supervisor_port.py \
            tests/test_t100_live_trailing_preflight.py \
            tests/test_t100_v40_owned_completed_bar_reader.py \
            tests/test_t100_v40_full_portfolio_runtime.py
