name: V40 sequential frozen lots and cross-margin stress (offline)

on:
  push:
    branches:
      - "feature/v40-sequential-cross-risk-bridge-*"
  pull_request:
    paths:
      - "app/t100_v40_unreleased_sequential_lot_margin.py"
      - "app/t100_v40_unreleased_sequential_cross_risk.py"
      - "tests/test_t100_v40_unreleased_sequential_cross_risk.py"
      - ".github/workflows/v40-sequential-cross-risk-bridge.yml"

permissions:
  contents: read

jobs:
  sequential-lot-and-stress-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: |
          python -m compileall -q \
            app/t100_v40_unreleased_sequential_lot_margin.py \
            app/t100_v40_unreleased_sequential_cross_risk.py
      - name: Test frozen lot and MEXC risk matching
        run: |
          python -m pytest -q \
            tests/test_t100_v40_unreleased_sequential_cross_risk.py \
            tests/test_t100_v40_unreleased_sequential_lot_margin.py \
            tests/test_t100_live_cross_margin_stress.py \
            tests/test_t100_v40_historical_margin_preview.py
