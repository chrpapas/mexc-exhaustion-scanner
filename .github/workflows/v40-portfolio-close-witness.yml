name: V40 multi-slot native-stop close and survivor witness

on:
  push:
    branches:
      - "feature/v40-portfolio-native-close-witness-*"
  pull_request:
    paths:
      - "app/t100_v40_unreleased_portfolio_native_close.py"
      - "tests/test_t100_v40_unreleased_portfolio_native_close.py"
      - ".github/workflows/v40-portfolio-close-witness.yml"

permissions:
  contents: read

jobs:
  one-close-other-three-protected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q app/t100_v40_unreleased_portfolio_native_close.py
      - name: Positive one-position closure and no release on uncertain TP label
        run: |
          python -m pytest -q \
            tests/test_t100_v40_unreleased_portfolio_native_close.py \
            tests/test_t100_v40_unreleased_normal_stop_observer.py \
            tests/test_t100_v40_four_slot_signed_observer.py
      - name: Ensure no production order executor imports unverified close logic
        run: |
          ! grep -R "t100_v40_unreleased_portfolio_native_close" \
            app/t100_v40_render_real_canary_worker.py \
            app/t100_v40_canary_durable_guardian.py
