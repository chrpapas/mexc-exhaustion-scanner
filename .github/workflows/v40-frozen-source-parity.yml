name: Frozen V40 7.238406x archive and exit-price parity

on:
  push:
    branches:
      - "feature/v40-frozen-7238406x-*"
  pull_request:
    paths:
      - "app/t100_v40_frozen_replay_identity.py"
      - "app/t100_v40_unreleased_exit_policy.py"
      - "tests/test_t100_v40_frozen_replay_identity.py"
      - "tests/test_t100_v40_unreleased_exit_policy.py"
      - ".github/workflows/v40-frozen-source-parity.yml"

permissions:
  contents: read

jobs:
  replay-identity-and-adverse-first-exits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile new reference-only modules
        run: python -m compileall -q app/t100_v40_frozen_replay_identity.py app/t100_v40_unreleased_exit_policy.py
      - name: Offline immutable backtest contract and gap-aware exit proof
        run: |
          python -m pytest -q \
            tests/test_t100_v40_frozen_replay_identity.py \
            tests/test_t100_v40_unreleased_exit_policy.py
      - name: Verify no new live-order flag or runtime wiring
        run: |
          ! grep -R "t100_v40_frozen_replay_identity" \
            app/t100_v40_render_real_canary_worker.py \
            app/t100_v40_render_executor_disabled_worker.py
