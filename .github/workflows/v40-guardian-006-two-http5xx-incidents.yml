name: V40 recovery 006 exactly two delivered 005 HTTP5xx incidents

on:
  push:
    branches:
      - "fix/v40-006-two-exact-http5xx-incidents-*"
  pull_request:
    paths:
      - "app/t100_v40_guardian_recovery_006.py"
      - "tests/test_t100_v40_guardian_recovery_006.py"
      - ".github/workflows/v40-guardian-006-two-http5xx-incidents.yml"

permissions:
  contents: read

jobs:
  two-independent-incidents-two-fresh-gets:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Exact two 005 HTTP5xx, five older scopes, unmodified latch and fresh exchange GETs
        run: |
          python -m compileall -q app/t100_v40_guardian_recovery_006.py
          python -m pytest -q \
            tests/test_t100_v40_guardian_recovery_006.py \
            tests/test_t100_v40_guardian_recovery_005.py \
            tests/test_t100_v40_canary_durable_guardian.py \
            tests/test_t100_v40_guardian_post_gate.py \
            tests/test_t100_v40_unreleased_nonflat_guardian_evidence.py
