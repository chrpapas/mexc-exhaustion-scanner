name: V40 live-source owned Min30 bar and cursor reader (read-only)

on:
  push:
    branches:
      - "feat/v40-real-nonflat-min30-exit-observer-*"
  pull_request:
    paths:
      - "app/t100_v40_owned_completed_bar_reader.py"
      - "tests/test_t100_v40_owned_completed_bar_reader.py"
      - ".github/workflows/v40-real-owned-min30-readonly.yml"

permissions:
  contents: read

jobs:
  exact-cursor-candle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q app/t100_v40_owned_completed_bar_reader.py
      - name: Test exact next bar and source roles
        run: |
          python -m pytest -q \
            tests/test_t100_v40_owned_completed_bar_reader.py \
            tests/test_t100_v40_unreleased_bar_cursor.py \
            tests/test_t100_v40_unreleased_verified_exit_handoff.py \
            tests/test_t100_v40_unreleased_exit_policy.py
