name: V40 006 guardian recovery after Render singleton handoff

on:
  push:
    branches:
      - "fix/v40-006-safe-restart-fresh-two-get-*"
  pull_request:
    paths:
      - "app/t100_v40_guardian_recovery_006.py"
      - "tests/test_t100_v40_guardian_recovery_006.py"
      - ".github/workflows/v40-guardian-006-rollover-after-restart.yml"

permissions:
  contents: read

jobs:
  guardian-restart-no-auto-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Retired singleton restart with complete signed-account replacement GETs
        run: |
          python -m compileall -q app/t100_v40_guardian_recovery_006.py
          python -m pytest -q \
            tests/test_t100_v40_guardian_recovery_006.py \
            tests/test_t100_v40_guardian_recovery_005.py \
            tests/test_t100_v40_canary_durable_guardian.py \
            tests/test_t100_v40_guardian_post_gate.py \
            tests/test_t100_v40_unreleased_nonflat_guardian_evidence.py
