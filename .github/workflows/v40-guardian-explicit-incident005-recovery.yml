name: V40 explicit incident-005 recovery (offline fail-closed)

on:
  push:
    branches:
      - "fix/v40-guardian-reviewed-incident-005-*"
  pull_request:
    paths:
      - "app/t100_v40_guardian_recovery_005.py"
      - "app/t100_v40_canary_durable_guardian.py"
      - "app/t100_v40_guardian_post_gate.py"
      - "app/t100_v40_unreleased_nonflat_guardian_evidence.py"
      - "tests/test_t100_v40_guardian_recovery_005.py"
      - ".github/workflows/v40-guardian-explicit-incident005-recovery.yml"

permissions:
  contents: read

jobs:
  preserve-five-old-scopes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile all reviewed guardian code
        run: |
          python -m compileall -q \
            app/t100_v40_guardian_recovery_005.py \
            app/t100_v40_canary_durable_guardian.py \
            app/t100_v40_guardian_post_gate.py \
            app/t100_v40_unreleased_nonflat_guardian_evidence.py
      - name: Test incident preservation, explicit approval, double signed account GET and no trade
        run: |
          python -m pytest -q \
            tests/test_t100_v40_guardian_recovery_005.py \
            tests/test_t100_v40_guardian_recovery_004.py \
            tests/test_t100_v40_guardian_post_gate.py \
            tests/test_t100_v40_unreleased_nonflat_guardian_evidence.py \
            tests/test_t100_v40_canary_durable_guardian.py \
            tests/test_t100_v40_guardian_incident_archive_audit.py \
            tests/test_t100_v40_portfolio_order_transport.py
