name: V40 offline funding/equity SSD audit

on:
  pull_request:
    paths:
      - "docs/evidence/issue-14/rebuild_funding_equity.py"
      - "tests/test_t100_live_v40_funding_equity_audit.py"
      - ".github/workflows/v40-offline-funding-equity-ssd.yml"

permissions:
  contents: read

jobs:
  offline-funding-equity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q docs/evidence/issue-14/rebuild_funding_equity.py
      - run: python -m pytest -q tests/test_t100_live_v40_funding_equity_audit.py
