name: V40 frozen 146-candidate occupancy coverage

on:
  pull_request:
    paths:
      - "scripts/v40_candidate_occupancy_audit.py"
      - "tests/test_t100_v40_candidate_occupancy_audit.py"
      - ".github/workflows/v40-candidate-occupancy-audit.yml"

permissions:
  contents: read

jobs:
  offline-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q scripts/v40_candidate_occupancy_audit.py
      - run: python -m pytest -q tests/test_t100_v40_candidate_occupancy_audit.py
