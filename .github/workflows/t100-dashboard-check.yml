name: T100 daily dashboard check

on:
  pull_request:
  push:
    branches:
      - t100-daily-dashboard-v2-20261007

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q app tests
      - name: T100 strategy, split, and dashboard tests
        run: |
          python -m pytest -q \
            tests/test_t100_200_strategy.py \
            tests/test_t100_service_split.py \
            tests/test_t100_performance.py
