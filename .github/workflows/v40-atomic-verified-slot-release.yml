name: V40 atomic close accounting and slot release (offline)

on:
  push:
    branches:
      - "feature/v40-atomic-verified-native-close-slot-release-*"
  pull_request:
    paths:
      - "app/t100_v40_unreleased_verified_slot_release.py"
      - "tests/test_t100_v40_unreleased_verified_slot_release.py"
      - ".github/workflows/v40-atomic-verified-slot-release.yml"

permissions:
  contents: read

jobs:
  close-release-cas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q app/t100_v40_unreleased_verified_slot_release.py
      - run: |
          python -m pytest -q \
            tests/test_t100_v40_unreleased_verified_slot_release.py \
            tests/test_t100_live_checkpoint_journal.py \
            tests/test_t100_live_durable_recovery.py \
            tests/test_t100_live_position_accounting.py \
            tests/test_t100_v40_unreleased_portfolio_native_close.py
