name: V40 production portfolio mutation permission invariants

on:
  push:
    branches:
      - "feat/v40-full-production-supervisor-assembly-*"
  pull_request:
    paths:
      - "app/t100_v40_live_portfolio_supervisor.py"
      - "tests/test_t100_v40_live_portfolio_supervisor.py"
      - ".github/workflows/v40-portfolio-production-mutation-permits.yml"

permissions:
  contents: read

jobs:
  no-unpermitted-sql-or-mexc-mutations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Compile and test supervisor including native exit release and cursor CAS
        run: |
          python -m compileall -q app/t100_v40_live_portfolio_supervisor.py
          python -m pytest -q \
            tests/test_t100_v40_live_portfolio_supervisor.py \
            tests/test_t100_v40_render_four_slot_readonly_worker.py \
            tests/test_t100_v40_portfolio_stop_supervisor_port.py \
            tests/test_t100_v40_portfolio_order_transport.py \
            tests/test_t100_v40_four_slot_release_policy.py
