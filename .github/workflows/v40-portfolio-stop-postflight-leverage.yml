name: V40 portfolio native-stop postflight leverage parity (offline)

on:
  push:
    branches:
      - "feat/v40-portfolio-stop-postflight-leverage-*"
  pull_request:
    paths:
      - "app/t100_live_v40_stop_completion_handoff.py"
      - "app/t100_live_v40_native_stop_recovery.py"
      - "tests/test_t100_v40_portfolio_stop_postflight_leverage.py"
      - ".github/workflows/v40-portfolio-stop-postflight-leverage.yml"

permissions:
  contents: read

jobs:
  frozen-strategy-cross-leverage-same-stop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: |
          python -m compileall -q \
            app/t100_live_v40_stop_completion_handoff.py \
            app/t100_live_v40_native_stop_recovery.py
      - name: Exact owned lot / selected leverage / native stop / durable CAS
        run: |
          python -m pytest -q \
            tests/test_t100_v40_portfolio_stop_postflight_leverage.py \
            tests/test_t100_live_v40_stop_completion_handoff.py \
            tests/test_t100_live_v40_native_stop_recovery.py \
            tests/test_t100_live_stop_update_pipeline.py \
            tests/test_t100_v40_portfolio_native_stop_transport.py \
            tests/test_t100_v40_portfolio_stop_supervisor_port.py \
            tests/test_t100_v40_four_slot_release_policy.py
