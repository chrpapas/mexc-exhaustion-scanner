name: V40 source pin and native-close settlement correctness (offline)

on:
  push:
    branches:
      - "feat/v40-stage2-identity-and-close-accounting-*"
  pull_request:
    paths:
      - "app/t100_live_v40_entry_coordinator.py"
      - "app/t100_v40_live_portfolio_supervisor.py"
      - "app/t100_live_position_accounting.py"
      - "tests/test_t100_live_v40_entry_coordinator.py"
      - "tests/test_t100_v40_four_slot_coordinator_monitor_identity.py"
      - "tests/test_t100_v40_live_portfolio_supervisor.py"
      - "tests/test_t100_live_position_accounting.py"
      - ".github/workflows/v40-execution-invariants.yml"

permissions:
  contents: read

jobs:
  verify-fail-closed-execution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Compile and test exact Stage2, protected entry and final native close
        run: |
          python -m compileall -q app/t100_live_v40_entry_coordinator.py app/t100_v40_live_portfolio_supervisor.py app/t100_live_position_accounting.py
          python -m pytest -q \
            tests/test_t100_live_v40_entry_coordinator.py \
            tests/test_t100_v40_four_slot_coordinator_monitor_identity.py \
            tests/test_t100_v40_live_portfolio_supervisor.py \
            tests/test_t100_v40_full_portfolio_runtime.py \
            tests/test_t100_live_position_accounting.py \
            tests/test_t100_v40_portfolio_close_financial_reader.py
