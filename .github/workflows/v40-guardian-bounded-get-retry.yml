name: V40 guardian transient signed GET hardening

on:
  push:
    branches:
      - "fix/v40-guardian-bounded-transient-mode-get-*"
  pull_request:
    paths:
      - "app/t100_v40_guardian_account_and_owned.py"
      - "tests/test_t100_v40_guardian_bounded_get_retry.py"
      - ".github/workflows/v40-guardian-bounded-get-retry.yml"

permissions:
  contents: read

jobs:
  transient-mode-get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: All signed GET/guardian resilience tests
        run: |
          python -m pytest -q \
            tests/test_t100_v40_guardian_bounded_get_retry.py \
            tests/test_t100_v40_guardian_get_failure_codes.py \
            tests/test_t100_v40_canary_durable_guardian.py \
            tests/test_t100_v40_four_slot_signed_observer.py
