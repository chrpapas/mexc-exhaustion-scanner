name: V40 standalone Mac Python 3.9 compatibility

on:
  pull_request:
    paths:
      - "docs/evidence/issue-14/rebuild_marked_equity_drawdown.py"
      - "tests/test_t100_v40_146_candidate_account_state_replay.py"
      - ".github/workflows/v40-standalone-python39.yml"

permissions:
  contents: read

jobs:
  standalone-mac-compatible:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m py_compile docs/evidence/issue-14/rebuild_marked_equity_drawdown.py
      - run: python -I docs/evidence/issue-14/rebuild_marked_equity_drawdown.py --help
      - run: python -m pytest -q tests/test_t100_v40_146_candidate_account_state_replay.py
