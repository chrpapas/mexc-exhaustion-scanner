name: V40 immutable guardian archive read-only audit

on:
  push:
    branches:
      - "feature/v40-guardian-readonly-archive-audit-*"
  pull_request:
    paths:
      - "app/t100_v40_guardian_incident_archive_audit.py"
      - "app/t100_v40_canary_durable_guardian.py"
      - "tests/test_t100_v40_guardian_incident_archive_audit.py"
      - ".github/workflows/v40-guardian-readonly-archive-audit.yml"

permissions:
  contents: read

jobs:
  audit-four-immutable-scopes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q app/t100_v40_guardian_incident_archive_audit.py
      - name: Verify read-only audit and guardian compatibility
        run: |
          python -m pytest -q \
            tests/test_t100_v40_guardian_incident_archive_audit.py \
            tests/test_t100_v40_canary_durable_guardian.py \
            tests/test_t100_v40_guardian_recovery_003.py \
            tests/test_t100_v40_guardian_post_gate.py
