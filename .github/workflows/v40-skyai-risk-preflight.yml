name: SKYAI risk preflight diagnostics, bounded GET retry and Discord delivery

on:
  pull_request:
    paths:
      - "app/t100_v40_first_canary_risk_witness.py"
      - "app/t100_v40_discord_events.py"
      - "tests/test_t100_v40_skyai_risk_preflight_diagnostics.py"
      - ".github/workflows/v40-skyai-risk-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  risk-witness-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Compile and verify fail-closed preflight, one GET-only retry and notification isolation
        run: |
          python -m compileall -q app/t100_v40_first_canary_risk_witness.py app/t100_v40_discord_events.py
          python -m pytest -q \
            tests/test_t100_v40_skyai_risk_preflight_diagnostics.py \
            tests/test_t100_v40_first_canary_risk_witness.py \
            tests/test_t100_v40_first_signal_execution.py \
            tests/test_t100_v40_discord_events.py \
            tests/test_t100_v40_render_real_canary_worker.py \
            tests/test_t100_live_v40_candidate_market_witness.py
