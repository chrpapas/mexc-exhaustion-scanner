name: V40 guardian 0-4 signed live evidence (GET-only)

on:
  push:
    branches:
      - "feature/v40-four-slot-guardian-live-observer-*"
  pull_request:
    paths:
      - "app/t100_v40_guardian_account_and_owned.py"
      - "app/t100_v40_canary_account_guardian.py"
      - "app/t100_v40_canary_durable_guardian.py"
      - "tests/test_t100_v40_guardian_four_slot_live_wiring.py"
      - ".github/workflows/v40-guardian-four-slot-live-wiring.yml"

permissions:
  contents: read

jobs:
  four-slot-signed-guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test exact native-stop guardian and no-trade safety
        run: |
          python -m pytest -q \
            tests/test_t100_v40_guardian_four_slot_live_wiring.py \
            tests/test_t100_v40_four_slot_signed_observer.py \
            tests/test_t100_v40_four_slot_guardian_policy.py \
            tests/test_t100_v40_guardian_owned_cross.py \
            tests/test_t100_v40_canary_durable_guardian.py \
            tests/test_t100_v40_guardian_get_failure_codes.py
