name: V40 supervisor positive native close to durable release

on:
  push:
    branches:
      - "feat/v40-supervisor-positive-native-close-release-*"
  pull_request:
    paths:
      - "app/t100_v40_live_portfolio_supervisor.py"
      - "tests/test_t100_v40_supervisor_positive_release_handoff.py"
      - ".github/workflows/v40-supervisor-positive-release.yml"

permissions:
  contents: read

jobs:
  positive-close-no-same-cycle-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q app/t100_v40_live_portfolio_supervisor.py
      - name: Test native-close-supervisor release gates
        run: |
          python -m pytest -q \
            tests/test_t100_v40_supervisor_positive_release_handoff.py \
            tests/test_t100_v40_live_portfolio_supervisor.py \
            tests/test_t100_v40_native_close_release_handoff.py \
            tests/test_t100_v40_unreleased_verified_slot_release.py
