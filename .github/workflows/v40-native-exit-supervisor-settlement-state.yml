name: V40 native-exit mismatch routes to safe supervisor settlement state

on:
  push:
    branches:
      - "feat/v40-supervisor-native-close-recovery-state-*"
  pull_request:
    paths:
      - "app/t100_v40_live_portfolio_supervisor.py"
      - "app/t100_v40_full_portfolio_runtime.py"
      - "tests/test_t100_v40_supervisor_native_exit_settlement.py"
      - "tests/test_t100_v40_full_portfolio_runtime.py"
      - ".github/workflows/v40-native-exit-supervisor-settlement-state.yml"

permissions:
  contents: read

jobs:
  cannot-reopen-after-native-close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Prove exact recovered slot cannot be recycled or reopened
        run: |
          python -m compileall -q app/t100_v40_live_portfolio_supervisor.py app/t100_v40_full_portfolio_runtime.py
          python -m pytest -q \
            tests/test_t100_v40_supervisor_native_exit_settlement.py \
            tests/test_t100_v40_native_close_mismatch_recovery.py \
            tests/test_t100_v40_full_portfolio_runtime.py \
            tests/test_t100_v40_live_portfolio_supervisor.py \
            tests/test_t100_v40_portfolio_positive_native_close_reader.py
