name: V40 audited guardian 004 recovery and latch (offline)

on:
  push:
    branches:
      - "fix/v40-guardian-audited-recovery-004-*"
  pull_request:
    paths:
      - "app/t100_v40_guardian_recovery_004.py"
      - "app/t100_v40_canary_durable_guardian.py"
      - "app/t100_v40_guardian_post_gate.py"
      - "app/t100_v40_guardian_incident_archive_audit.py"
      - "tests/test_t100_v40_guardian_recovery_004.py"
      - ".github/workflows/v40-guardian-recovery-004.yml"

permissions:
  contents: read

jobs:
  audited-one-time-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: |
          python -m compileall -q \
            app/t100_v40_guardian_recovery_004.py \
            app/t100_v40_guardian_post_gate.py
      - name: Test all guardian audit, durable latch and post gate components
        run: |
          python -m pytest -q \
            tests/test_t100_v40_guardian_recovery_004.py \
            tests/test_t100_v40_guardian_recovery_003.py \
            tests/test_t100_v40_guardian_incident_archive_audit.py \
            tests/test_t100_v40_guardian_post_gate.py \
            tests/test_t100_v40_canary_durable_guardian.py \
            tests/test_t100_v40_guardian_bounded_get_retry.py
