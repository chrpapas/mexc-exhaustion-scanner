name: V40 native close actual fill and funding economics (offline)

on:
  push:
    branches:
      - "feat/v40-native-close-financial-evidence-*"
  pull_request:
    paths:
      - "app/t100_v40_portfolio_close_financial_reader.py"
      - "tests/test_t100_v40_portfolio_close_financial_reader.py"
      - ".github/workflows/v40-native-close-financial-evidence.yml"

permissions:
  contents: read

jobs:
  strict-closed-position-economics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Compile and verify original entry, native close, funding and no TP-label corruption
        run: |
          python -m compileall -q app/t100_v40_portfolio_close_financial_reader.py
          python -m pytest -q \
            tests/test_t100_v40_portfolio_close_financial_reader.py \
            tests/test_t100_live_position_accounting.py \
            tests/test_t100_live_fill_ledger.py \
            tests/test_t100_live_funding_ledger.py \
            tests/test_t100_live_close_provenance.py \
            tests/test_t100_v40_unreleased_portfolio_native_close.py \
            tests/test_t100_v40_native_close_release_handoff.py \
            tests/test_t100_v40_unreleased_verified_slot_release.py
