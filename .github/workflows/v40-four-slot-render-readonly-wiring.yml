name: V40 four-slot Render real-source wiring (GET-only)

on:
  pull_request:
    paths:
      - "app/t100_v40_render_four_slot_readonly_worker.py"
      - "app/t100_v40_render_executor_disabled_worker.py"
      - "tests/test_t100_v40_render_four_slot_readonly_worker.py"
      - ".github/workflows/v40-four-slot-render-readonly-wiring.yml"
  push:
    branches:
      - "feat/v40-four-slot-render-readonly-wiring-*"

permissions:
  contents: read

jobs:
  readonly-failclosed-wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: |
          python -m compileall -q \
            app/t100_v40_render_four_slot_readonly_worker.py \
            app/t100_v40_render_executor_disabled_worker.py
      - name: Test four-slot wiring, guardian and no mutation
        run: |
          python -m pytest -q \
            tests/test_t100_v40_render_four_slot_readonly_worker.py \
            tests/test_t100_v40_live_portfolio_supervisor.py \
            tests/test_t100_v40_guardian_post_gate.py \
            tests/test_t100_live_four_slot_mexc_readonly.py \
            tests/test_t100_live_v40_stage2_source.py
