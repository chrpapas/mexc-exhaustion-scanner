name: V40 forward live close-only final account and slot release

on:
  push:
    branches:
      - "feat/v40-forward-close-finalize-*"
  pull_request:
    paths:
      - "app/t100_v40_forward_close_finalizer.py"
      - "tests/test_t100_v40_forward_close_finalizer.py"
      - ".github/workflows/v40-forward-close-finalizer.yml"

permissions:
  contents: read

jobs:
  closed-position-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Exercise exact full closed-position forward settlement; no exchange POST
        run: |
          python -m compileall -q app/t100_v40_forward_close_finalizer.py
          python -m pytest -q \
            tests/test_t100_v40_forward_close_finalizer.py \
            tests/test_t100_v40_close_financial_artifact_staging.py \
            tests/test_t100_v40_portfolio_close_financial_reader.py \
            tests/test_t100_v40_native_close_mismatch_recovery.py \
            tests/test_t100_v40_native_close_release_handoff.py \
            tests/test_t100_v40_unreleased_verified_slot_release.py \
            tests/test_t100_v40_full_portfolio_runtime.py \
            tests/test_t100_v40_live_portfolio_supervisor.py
