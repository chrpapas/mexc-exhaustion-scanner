name: V40 positive native exit from ledger/venue slot mismatch (no POST)

on:
  push:
    branches:
      - "feat/v40-positive-native-exit-after-snapshot-mismatch-*"
  pull_request:
    paths:
      - "app/t100_v40_native_close_mismatch_recovery.py"
      - "app/t100_v40_full_portfolio_runtime.py"
      - "tests/test_t100_v40_native_close_mismatch_recovery.py"
      - "tests/test_t100_v40_full_portfolio_runtime.py"
      - ".github/workflows/v40-native-exit-mismatch-positive-recovery.yml"

permissions:
  contents: read

jobs:
  signed-close-before-db-close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Offline exact one-missing stop proof with full existing portfolio suite
        run: |
          python -m compileall -q app/t100_v40_native_close_mismatch_recovery.py app/t100_v40_full_portfolio_runtime.py
          python -m pytest -q \
            tests/test_t100_v40_native_close_mismatch_recovery.py \
            tests/test_t100_v40_full_portfolio_runtime.py \
            tests/test_t100_v40_portfolio_positive_native_close_reader.py \
            tests/test_t100_v40_unreleased_portfolio_native_close.py \
            tests/test_t100_v40_unreleased_verified_slot_release.py \
            tests/test_t100_v40_live_portfolio_supervisor.py \
            tests/test_t100_live_four_slot_snapshot_coordinator.py
