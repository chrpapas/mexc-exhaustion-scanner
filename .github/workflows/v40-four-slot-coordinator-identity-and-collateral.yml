name: V40 four-slot coordinator final Stage2 / asset contract gates

on:
  push:
    branches:
      - "feat/v40-four-slot-entry-coordinator-release-gates-*"
  pull_request:
    paths:
      - "app/t100_live_v40_entry_coordinator.py"
      - "app/t100_v40_portfolio_order_transport.py"
      - "tests/test_t100_v40_four_slot_coordinator_monitor_identity.py"
      - "tests/test_t100_v40_portfolio_order_transport.py"
      - ".github/workflows/v40-four-slot-coordinator-identity-and-collateral.yml"

permissions:
  contents: read

jobs:
  real-source-last-moment-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Compile
        run: |
          python -m compileall -q \
            app/t100_live_v40_entry_coordinator.py \
            app/t100_v40_portfolio_order_transport.py
      - name: Regression including all preclaim, claim and native SL boundaries
        run: |
          python -m pytest -q \
            tests/test_t100_v40_four_slot_coordinator_monitor_identity.py \
            tests/test_t100_v40_portfolio_order_transport.py \
            tests/test_t100_live_v40_entry_coordinator.py \
            tests/test_t100_live_v40_dispatch_executor.py \
            tests/test_t100_v40_four_slot_release_policy.py \
            tests/test_t100_v40_exchange_leverage_plan.py \
            tests/test_t100_live_mexc_adapter.py \
            tests/test_t100_v40_live_portfolio_supervisor.py
