name: V40 full-portfolio supervisor state machine (release-gated)

on:
  push:
    branches:
      - "feature/v40-durable-four-slot-live-supervisor-*"
  pull_request:
    paths:
      - "app/t100_v40_live_portfolio_supervisor.py"
      - "tests/test_t100_v40_live_portfolio_supervisor.py"
      - ".github/workflows/v40-live-portfolio-supervisor.yml"

permissions:
  contents: read

jobs:
  supervised-state-machine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q app/t100_v40_live_portfolio_supervisor.py
      - run: |
          python -m pytest -q \
            tests/test_t100_v40_live_portfolio_supervisor.py \
            tests/test_t100_v40_unreleased_verified_exit_handoff.py \
            tests/test_t100_v40_unreleased_native_stop_cycle.py \
            tests/test_t100_v40_unreleased_portfolio_native_close.py \
            tests/test_t100_v40_unreleased_portfolio_exit_batch.py \
            tests/test_t100_v40_guardian_post_gate.py \
            tests/test_t100_v40_unreleased_nonflat_guardian_evidence.py
