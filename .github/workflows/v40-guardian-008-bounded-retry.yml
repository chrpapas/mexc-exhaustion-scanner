name: V40 inventory GET retry and audited 008 guardian recovery

on:
  pull_request:
    paths:
      - "app/t100_live_guardian_readonly_once.py"
      - "app/t100_v40_guardian_account_and_owned.py"
      - "app/t100_v40_guardian_recovery_008.py"
      - "app/t100_v40_canary_durable_guardian.py"
      - "app/t100_v40_guardian_post_gate.py"
      - "app/t100_v40_emergency_nonflat_gate.py"
      - "app/t100_v40_unreleased_nonflat_guardian_evidence.py"
      - "tests/test_t100_v40_guardian_bounded_inventory_retries.py"
      - "tests/test_t100_v40_guardian_transient_stops_retry.py"
      - "tests/test_t100_v40_guardian_recovery_008.py"
      - ".github/workflows/v40-guardian-008-bounded-retry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-and-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Compile and offline safety regression
        run: |
          python -m compileall -q app/t100_live_guardian_readonly_once.py app/t100_v40_guardian_account_and_owned.py app/t100_v40_guardian_recovery_008.py app/t100_v40_canary_durable_guardian.py
          python -m pytest -q \
            tests/test_t100_v40_guardian_bounded_inventory_retries.py \
            tests/test_t100_v40_guardian_transient_stops_retry.py \
            tests/test_t100_v40_guardian_transient_positions_retry.py \
            tests/test_t100_v40_guardian_recovery_008.py \
            tests/test_t100_v40_guardian_recovery_007.py \
            tests/test_t100_v40_guardian_recovery_005.py \
            tests/test_t100_v40_canary_durable_guardian.py \
            tests/test_t100_v40_guardian_post_gate.py
