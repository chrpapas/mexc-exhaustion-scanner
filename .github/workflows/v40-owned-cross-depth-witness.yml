name: V40 1-3 owned CROSS candidate signed GET and depth

on:
  push:
    branches:
      - "feat/v40-owned-cross-depth-witness-*"
  pull_request:
    paths:
      - "app/t100_v40_owned_cross_candidate_witness.py"
      - "app/t100_live_v40_entry_coordinator.py"
      - "app/t100_live_v40_candidate_market_witness.py"
      - "tests/test_t100_v40_owned_cross_candidate_witness.py"
      - ".github/workflows/v40-owned-cross-depth-witness.yml"

permissions:
  contents: read

jobs:
  signed-owned-depth:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Test non-flat signed account bookends, frozen risk, exact depth, flat isolation
        run: |
          python -m compileall -q app/t100_v40_owned_cross_candidate_witness.py app/t100_live_v40_entry_coordinator.py
          python -m pytest -q \
            tests/test_t100_v40_owned_cross_candidate_witness.py \
            tests/test_t100_live_v40_entry_coordinator.py \
            tests/test_t100_live_v40_candidate_market_witness.py \
            tests/test_t100_v40_exchange_leverage_plan.py \
            tests/test_t100_v40_unreleased_same_signer_risk_reader.py \
            tests/test_t100_v40_concrete_portfolio_factory.py
