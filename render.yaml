services:
  - type: worker
    name: mexc-exhaustion-scanner
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install .
    startCommand: python -m app.worker
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mexc-exhaustion-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: EXECUTION_ENABLED
        value: "false"
      - key: MEXC_SPOT_BASE_URL
        value: https://api.mexc.com
      - key: REQUIRE_MEXC_SPOT_PAIR
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: DISCORD_SIGNAL_LEVELS
        value: confirmed_short
      - key: DISCORD_PERFORMANCE_WEBHOOK_URL
        sync: false
      - key: DISCORD_TRADER_EVENTS_WEBHOOK_URL
        sync: false
      - key: TRADER_WATCHDOG_STALE_SECONDS
        value: "180"
      - key: MIN_AMOUNT_24H
        value: "3000000"
      - key: MAX_SPREAD_PCT
        value: "0.35"
      - key: HIGH_RISK_MIN_AMOUNT_24H
        value: "500000"
      - key: HIGH_RISK_MAX_SPREAD_PCT
        value: "1.0"
      - key: DISCOVERY_MIN_RETURN_24H
        value: "0.05"
      - key: DISCOVERY_MIN_CROSS_SECTION_PERCENTILE
        value: "0.70"
      - key: WIDE_SCAN_SECONDS
        value: "3600"
      - key: WIDE_SCAN_MIN_RETURN_72H
        value: "0.20"
      - key: DIAGNOSTIC_SYMBOLS
        value: CASHCAT_USDT
      - key: STATE_MIN_RUN_SCORE
        value: "3"
      - key: RUN_WATCH_MIN_24H
        value: "0.08"
      - key: RUN_WATCH_MIN_72H
        value: "0.20"
      - key: EXHAUSTION_WATCH_MIN_72H
        value: "0.30"
      - key: EXHAUSTION_WATCH_MIN_24H
        value: "-0.25"
      - key: EXHAUSTION_WATCH_MAX_24H
        value: "0.08"
      - key: ACTIVE_EXHAUSTION_MIN_SCORE
        value: "2"
      - key: WATCH_ALERTS_ENABLED
        value: "true"
      - key: RUN_WATCH_ALERT_COOLDOWN_MINUTES
        value: "120"
      - key: EXHAUSTION_WATCH_ALERT_COOLDOWN_MINUTES
        value: "120"
      - key: SHORT_EXHAUSTION_SCORE
        value: "3"
      - key: RETEST_WINDOW_CANDLES
        value: "6"
      - key: RETEST_TOLERANCE_ATR
        value: "0.5"
      - key: REARM_NEW_HIGH_PCT
        value: "0.05"
      - key: EPISODE_MAX_AGE_HOURS
        value: "240"
      - key: PERFORMANCE_POLL_SECONDS
        value: "300"
      - key: PERFORMANCE_REPORT_CHECK_SECONDS
        value: "60"
      - key: PERFORMANCE_REPORT_HOUR
        value: "18"
      - key: PERFORMANCE_REPORT_TIMEZONE
        value: Europe/Zurich
      - key: RESEARCH_LOGGING_ENABLED
        value: "true"
      - key: RESEARCH_PATH_POLL_SECONDS
        value: "900"
      - key: RESEARCH_PATH_BATCH_ROWS
        value: "2000"
      - key: RESEARCH_PATH_HORIZON_HOURS
        value: "168"
      - key: RESEARCH_DB_TIMEOUT_SECONDS
        value: "10"
      - key: MAX_SYMBOLS
        value: "400"
      - key: TICKER_POLL_SECONDS
        value: "60"
      - key: TICKER_STORE_SECONDS
        value: "300"
      - key: SIGNAL_POLL_SECONDS
        value: "300"
      - key: SIGNAL_EVAL_CONCURRENCY
        value: "3"
      - key: SIGNAL_EVAL_PROGRESS_EVERY
        value: "50"
      - key: CANDLE_POLL_SECONDS
        value: "900"
      - key: FUNDING_REFRESH_SECONDS
        value: "3600"
      - key: CONTRACT_REFRESH_SECONDS
        value: "21600"

  - type: worker
    name: mexc-standard-short-trader
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install .
    startCommand: python -m app.trader
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mexc-exhaustion-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: MEXC_BASE_URL
        value: https://api.mexc.com
      - key: MEXC_WS_URL
        value: wss://contract.mexc.com/edge
      - key: TRADING_MODE
        value: paper
      - key: TRADER_MARGIN_MODE
        value: cross
      - key: TRADER_LEVERAGE
        value: "1"
      - key: TRADER_ALLOWED_RISK_TIERS
        value: STANDARD,HIGH_RISK
      - key: TRADER_MAX_OPEN_POSITIONS
        value: "6"
      - key: TRADER_MAX_TOTAL_EXPOSURE_PCT
        value: "20"
      - key: TRADER_MAX_HIGH_RISK_POSITIONS
        value: "5"
      - key: TRADER_ALLOW_SAME_SYMBOL_PARALLEL
        value: "false"
      - key: PAPER_STARTING_EQUITY_USDT
        value: "2000"
      - key: TRADER_PAPER_TAKER_FEE_RATE
        value: "0.0008"
      - key: TRADER_POLL_SECONDS
        value: "5"
      - key: TRADER_PROCESS_EXISTING_SIGNALS
        value: "false"
      - key: TRADER_MAX_SIGNAL_AGE_SECONDS
        value: "900"
      - key: TRADER_PROFIT_TARGET_PCT
        value: "20"
      - key: TRADER_PROTECTION_ARM_PCT
        value: "25"
      - key: TRADER_TRAIL_CALLBACK_PCT
        value: "15"
      - key: TRADER_PROTECTION_UPDATE_STEP_PCT
        value: "1"
      - key: TRADER_PROTECTION_NOTIFY_STEP_PCT
        value: "10"
      - key: TRADER_DISCORD_HEARTBEAT_SECONDS
        value: "900"
      - key: TRADER_ERROR_ALERT_COOLDOWN_SECONDS
        value: "300"
      - key: DISCORD_TRADER_EVENTS_WEBHOOK_URL
        sync: false
      - key: MEXC_LIVE_ORDER_API_ENABLED
        value: "false"
      - key: MEXC_API_KEY
        sync: false
      - key: MEXC_API_SECRET
        sync: false
      - key: LIVE_TRADING_CONFIRM
        sync: false

databases:
  - name: mexc-exhaustion-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: mexc_exhaustion
    user: mexc_scanner
    ipAllowList: []
