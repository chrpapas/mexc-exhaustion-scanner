services:
  - type: worker
    name: mexc-exhaustion-scanner
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install .
    startCommand: python -m app.worker
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mexc-exhaustion-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: EXECUTION_ENABLED
        value: "false"
      - key: MEXC_SPOT_BASE_URL
        value: https://api.mexc.com
      - key: REQUIRE_MEXC_SPOT_PAIR
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: MIN_AMOUNT_24H
        value: "10000000"
      - key: MAX_SPREAD_PCT
        value: "0.25"
      - key: MAX_SYMBOLS
        value: "250"
      - key: TICKER_POLL_SECONDS
        value: "60"
      - key: TICKER_STORE_SECONDS
        value: "300"
      - key: SIGNAL_POLL_SECONDS
        value: "300"
      - key: CANDLE_POLL_SECONDS
        value: "900"
      - key: FUNDING_REFRESH_SECONDS
        value: "3600"
      - key: CONTRACT_REFRESH_SECONDS
        value: "21600"

databases:
  - name: mexc-exhaustion-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: mexc_exhaustion
    user: mexc_scanner
    ipAllowList: []
